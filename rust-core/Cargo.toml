[package]
name = "rag_ingestion_core"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
lopdf = { version = "0.32", default-features = false, features = ["chrono_time", "nom_parser"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rstar = "0.12"
strsim = "0.11"
flate2 = "1"
tokenizers = { version = "0.15", default-features = false, features = ["onig"] }
time = "=0.3.36"
chrono = "=0.4.38"

[profile.release]
opt-level = 3
lto = true
